<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Laporan Kehadiran v3.0</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: white; border-radius: 12px; padding: 40px; max-width: 380px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 28px; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>&#128203; Laporan Kehadiran</h1>
    <p class="subtitle">Tectona Group — v3.0</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-list">
          {% for category, message in messages %}
            <li class="flash-item {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login_post') }}">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autofocus required placeholder="Masukkan password HR">
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-2">Masuk</button>
    </form>
  </div>
</body>
</html>
