{% set masuk = day.adj_jam_masuk or day.raw_scan1 %}
{% set keluar = day.adj_jam_keluar or day.raw_scan2 %}

<div class="cell-edit" id="cell-edit-{{ day.id }}">
  <div style="font-size:0.72rem;color:#888;margin-bottom:6px;font-weight:600;">
    {{ day.tanggal[8:10] }}-{{ day.tanggal[5:7] }}-{{ day.tanggal[:4] }} · {{ day.nama }}
  </div>
  <div style="font-size:0.7rem;color:#aaa;margin-bottom:6px;">
    Raw: {{ day.raw_scan1 or '—' }} / {{ day.raw_scan2 or '—' }}
  </div>

  <!-- Status (read-only, set at import) -->
  <div style="margin-bottom:8px;">
    <label style="font-size:0.72rem;color:#888;display:block;margin-bottom:2px;">Status</label>
    <span style="font-size:0.78rem;color:#555;background:#f5f5f5;padding:2px 8px;border-radius:4px;border:1px solid #ddd;">
      {{ day.status_hari or '—' }}
    </span>
  </div>

  <form hx-post="{{ url_for('review.cell_save', period_id=period_id, day_id=day.id) }}"
        hx-target="#day-{{ day.id }}"
        hx-swap="innerHTML">
    <div>
      <label>Jam Masuk</label>
      <input type="time" name="adj_jam_masuk" value="{{ (day.adj_jam_masuk or day.raw_scan1 or '')[:5] }}" step="60">
    </div>
    <div>
      <label>Jam Keluar</label>
      <input type="time" name="adj_jam_keluar" value="{{ (day.adj_jam_keluar or day.raw_scan2 or '')[:5] }}" step="60">
    </div>

    <!-- Penyesuaian Keterlambatan: affects menit_terlambat only -->
    <div>
      <label>Penyesuaian Keterlambatan <span style="color:#888;font-weight:normal;font-size:0.75rem;">(kurangi menit terlambat)</span></label>
      <select name="adj_keterlambatan">
        <option value="">— (tidak ada)</option>
        {% for key, label in keterlambatan_choices %}
        <option value="{{ key }}" {% if day.adj_keterlambatan == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <!-- Penyesuaian Absen: affects HK Tidak Ada Scan only -->
    <div>
      <label>Penyesuaian Absen <span style="color:#888;font-weight:normal;font-size:0.75rem;">(kurangi HK Tdk Scan)</span></label>
      <select name="adj_absen">
        <option value="">— (tidak ada)</option>
        {% for key, label in absen_choices %}
        <option value="{{ key }}" {% if day.adj_absen == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Catatan</label>
      <input type="text" name="catatan_manual" placeholder="Keterangan tambahan" value="{{ day.catatan_manual or '' }}">
    </div>

    <div class="flex mt-2">
      <button type="submit" class="btn btn-primary btn-sm">Simpan</button>
      <button type="button" class="btn btn-secondary btn-sm"
              hx-get="{{ url_for('review.cell_view', period_id=period_id, day_id=day.id) }}"
              hx-target="#day-{{ day.id }}"
              hx-swap="innerHTML">Batal</button>
    </div>
  </form>
</div>
