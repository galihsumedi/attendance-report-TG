{% extends 'base.html' %}
{% block title %}Upload Scanlog{% endblock %}
{% block content %}
<div style="max-width: 560px; margin: 40px auto;">
  <div class="card">
    <h1>Upload Scanlog</h1>
    <p class="text-muted mt-2">Format .xls atau .xlsx · Maks 16 MB</p>

    <form id="uploadForm" style="margin-top: 20px;">
      <div class="form-group">
        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">&#128193;</div>
          <div>Klik atau seret file ke sini</div>
          <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" name="file" accept=".xlsx,.xls" style="display:none" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Proses Scanlog</button>
    </form>

    <div id="preflight-result" style="margin-top: 20px;"></div>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileName  = document.getElementById('fileName');
const submitBtn = document.getElementById('submitBtn');
const form      = document.getElementById('uploadForm');

fileInput.addEventListener('change', () => {
  if (fileInput.files.length > 0) fileName.textContent = '✅ ' + fileInput.files[0].name;
});

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) {
    fileInput.files = e.dataTransfer.files;
    fileName.textContent = '✅ ' + e.dataTransfer.files[0].name;
  }
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!fileInput.files.length) return;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Memproses...';

  const fd = new FormData();
  fd.append('file', fileInput.files[0]);

  const resp = await fetch('/upload/preflight', { method: 'POST', body: fd });
  const html = await resp.text();
  document.getElementById('preflight-result').innerHTML = html;

  submitBtn.disabled = false;
  submitBtn.textContent = 'Proses Scanlog';
});
</script>
{% endblock %}
